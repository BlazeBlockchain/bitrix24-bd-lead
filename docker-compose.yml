# Basic backend skeleton compose (T004). Mirrors vanguard-game/docker-compose.yml
# (no top-level version: modern compose ignores it + warns)
# Run: docker compose up -d db backend
# For full (later): add redis, web, etc per ARCHITECTURE.md
services:
  bdlead-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bdlead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-bdlead_db}
    volumes:
      - bdlead_db_data:/var/lib/postgresql/data
    networks:
      - bbspace_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bdlead} -d ${POSTGRES_DB:-bdlead_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bdlead-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bdlead}:${POSTGRES_PASSWORD:-dev-password}@bdlead-db:5432/${POSTGRES_DB:-bdlead_db}
      DEBUG: "true"
      DEFAULT_CRM_PROVIDER: ${DEFAULT_CRM_PROVIDER:-bitrix24}
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-in-prod}
      # Empty = any Google account may sign in. Fine locally, wrong anywhere reachable.
      AUTH_EMAIL_ALLOWLIST: ${AUTH_EMAIL_ALLOWLIST:-}
      ENCRYPTION_KEK: ${ENCRYPTION_KEK:-}
      # 010 kill switch. Setting RETRIEVAL_ENABLED=false degrades every brief to the
      # 009 presentation (no source link) rather than erroring — see config.py.
      RETRIEVAL_ENABLED: ${RETRIEVAL_ENABLED:-true}
      RETRIEVAL_TIMEOUT_SECONDS: ${RETRIEVAL_TIMEOUT_SECONDS:-6.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}  # comma-separated, or empty for same-origin (nginx proxy)
      # LLM proxy: Gemini primary, Claude Haiku fallback, deterministic mock if both are empty.
      # Without these the backend ALWAYS returns mock-llm output, however the keys are set in .env.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-20241022}
      LLM_DAILY_BUDGET_CENTS: ${LLM_DAILY_BUDGET_CENTS:-200}
    depends_on:
      bdlead-db:
        condition: service_healthy
    networks:
      - bbspace_net
    ports:
      # Loopback-bound on purpose. Local dev still reaches http://localhost:8000
      # unchanged, but on a shared host this port is NOT published to the internet:
      # the API is only otherwise reachable over bbspace_net, which is how the web
      # container and the shared reverse proxy already talk to it. Dropping the
      # 127.0.0.1 prefix puts an internet-facing FastAPI on port 8000, bypassing
      # both TLS and the proxy.
      #
      # The host port is a variable because a shared box already has something on
      # 8000. Compose cannot remove an inherited `ports` entry on the server's
      # compose v2.18 (`!override` needs v2.24+), so a deployment moves the binding
      # rather than dropping it — see BACKEND_PORT in .env.staging.example.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  bdlead-web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_BASE: "/"
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      # Loopback-bound for the same reason as the backend above. The deployed demo is
      # served through the shared nginx stack over bbspace_net, never off this port.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      - bbspace_net
    depends_on:
      - bdlead-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  bdlead_db_data:

networks:
  bbspace_net:
    external: true
