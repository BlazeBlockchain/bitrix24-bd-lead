<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Lead AI - Popup</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 0;
    }

    .popup-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .header-title {
      font-weight: 600;
      font-size: 14px;
      margin: 0;
    }

    .header-links {
      display: flex;
      gap: 8px;
      font-size: 12px;
    }

    .header-links a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
    }

    .header-links a:hover {
      text-decoration: underline;
    }

    .content {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 13px;
    }

    .status-section h3 {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .status-line:last-child {
      margin-bottom: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .status-dot.online {
      background: var(--accent-3);
    }

    .status-dot.offline {
      background: var(--danger);
    }

    .status-text {
      font-size: 13px;
      color: var(--text);
    }

    .status-text.muted {
      color: var(--muted);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-primary {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #ea6317;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .info-box {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 12px;
      color: var(--danger);
      text-align: center;
    }

    .footer {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h1 class="header-title">BD Lead AI</h1>
      <div class="header-links">
        <a id="openOptions" title="Settings">⚙️</a>
        <a id="openWeb" title="Dashboard">📊</a>
      </div>
    </div>

    <div class="content">
      <!-- Main action -->
      <div id="panelAvailable">
        <button id="openPanelBtn" class="btn-primary">Open BD Lead panel</button>
      </div>

      <!-- Fallback when panel is not available -->
      <div id="panelUnavailable" style="display: none;" class="info-box">
        BD Lead side panel requires Chrome 116 or later.
        <br><br>
        <a id="dashboardLink" href="#" style="color: var(--accent); text-decoration: none;">Visit the web dashboard →</a>
      </div>

      <!-- Status section -->
      <div class="status-section">
        <h3>Status</h3>

        <!-- API status -->
        <div class="status-line">
          <div class="status-dot" id="apiDot"></div>
          <span class="status-text" id="apiText">Checking API...</span>
        </div>

        <!-- Auth status -->
        <div class="status-line">
          <div class="status-dot" id="authDot"></div>
          <span class="status-text" id="authText">Checking session...</span>
        </div>
      </div>

      <!-- Quick links -->
      <div class="button-group">
        <a href="#" id="connectionsLink" style="padding: 8px; text-align: center; color: var(--accent); text-decoration: none; font-size: 12px;">📋 Manage connections</a>
      </div>
    </div>

    <div class="footer">
      <span id="versionLabel"></span>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
