<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Lead AI - Popup</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #1c2330;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #f97316;
      --accent-2: #38bdf8;
      --accent-3: #4ade80;
      --danger: #f87171;
      --radius: 8px;
      --font-sans: system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 500px;
      margin: 0;
      padding: 0;
      font: 13px/1.5 var(--font-sans);
      color: var(--text);
      background: var(--bg);
    }

    .popup-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .header-title {
      font-weight: 600;
      font-size: 14px;
      margin: 0;
    }

    .header-links {
      display: flex;
      gap: 8px;
      font-size: 12px;
    }

    .header-links a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
    }

    .header-links a:hover {
      text-decoration: underline;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }

    input, select, textarea {
      font: inherit;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 8px;
      border-radius: var(--radius);
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 50px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      font: inherit;
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .preview {
      margin-top: 16px;
      padding: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: none;
    }

    .preview.active {
      display: block;
    }

    .preview h4 {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--accent);
    }

    .preview-section {
      margin-bottom: 10px;
    }

    .preview-section strong {
      color: var(--text);
      font-size: 12px;
    }

    .preview-section p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .task-item {
      border-left: 3px solid var(--accent-3);
      padding-left: 8px;
      margin: 8px 0;
      font-size: 11px;
    }

    .task-item strong {
      color: var(--text);
    }

    .task-due {
      color: var(--accent-3);
      font-weight: 500;
    }

    .task-rationale {
      color: var(--muted);
      margin-top: 2px;
      font-size: 10px;
      line-height: 1.3;
    }

    .status {
      padding: 8px;
      border-radius: var(--radius);
      font-size: 11px;
      margin-top: 8px;
    }

    .status.loading {
      background: var(--surface-2);
      color: var(--accent-2);
    }

    .status.success {
      background: rgba(74, 222, 128, 0.1);
      color: var(--accent-3);
      border: 1px solid var(--accent-3);
    }

    .status.error {
      background: rgba(248, 113, 113, 0.1);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .hidden {
      display: none;
    }

    .footer {
      font-size: 10px;
      color: var(--muted);
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h1 class="header-title">BD Lead AI</h1>
      <div class="header-links">
        <a id="openOptions" title="Settings">⚙️</a>
        <a id="openWeb" title="Dashboard">📊</a>
      </div>
    </div>

    <div class="content">
      <form id="leadForm">
        <div class="form-group">
          <label for="company_name">Company *</label>
          <input type="text" id="company_name" name="company_name" placeholder="Acme Inc" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="contact_name">Contact *</label>
            <input type="text" id="contact_name" name="contact_name" placeholder="Jane Smith" required>
          </div>
          <div class="form-group">
            <label for="contact_role">Role *</label>
            <input type="text" id="contact_role" name="contact_role" placeholder="VP Sales" required>
          </div>
        </div>

        <div class="form-group">
          <label for="signal">Signal / Trigger</label>
          <input type="text" id="signal" name="signal" placeholder="Series B, new leadership...">
        </div>

        <div class="form-group">
          <label for="pain_point">Pain point / Why now</label>
          <input type="text" id="pain_point" name="pain_point">
        </div>

        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" placeholder="Add context (bullets ok)"></textarea>
        </div>

        <div class="form-group">
          <label for="provider">CRM Provider</label>
          <select id="provider" name="provider">
            <option value="bitrix24">Bitrix24</option>
            <option value="hubspot">HubSpot</option>
          </select>
        </div>

        <div class="buttons">
          <button type="button" id="generateBtn">Generate with AI</button>
          <button type="button" id="pushBtn" class="secondary" disabled>Push to CRM</button>
        </div>

        <div id="status" class="status hidden"></div>
      </form>

      <div id="preview" class="preview">
        <h4>AI Preview</h4>
        <div id="previewContent"></div>
      </div>
    </div>

    <div class="footer">
      v0.1.0 | Connected to <span id="apiStatus">API</span>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
