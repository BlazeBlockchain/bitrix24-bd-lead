<!DOCTYPE html>
<html lang="en" data-density="compact">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Lead AI - Side Panel</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      /* Explicit, never inherited -- see the note in tokens.css. */
      font-size: var(--fs-body);
      overflow-x: hidden;
    }

    .panel-container {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ---------- header ---------- */
    .panel-header {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 14, 24, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-title {
      font-size: var(--fs-section);
      font-weight: 600;
      letter-spacing: var(--ls-tight);
      margin: 0;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .api-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      background: var(--muted-dim);
      flex-shrink: 0;
    }

    .api-status.online {
      background: var(--green);
      box-shadow: 0 0 8px rgba(16, 185, 129, .6);
    }

    .auth-area {
      font-size: var(--fs-chip);
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .auth-area.valid {
      color: #6ee7b7;
    }

    .auth-button {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-size: var(--fs-chip);
      color: #8ab0ff;
      cursor: pointer;
      text-decoration: underline;
    }

    .auth-button:hover {
      text-decoration: none;
    }

    /* ---------- content ---------- */
    .panel-content {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      margin-bottom: 0;
    }

    .grab-button {
      align-self: flex-start;
    }

    /* ---------- preview ---------- */
    .preview-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* The four brief sections are one flex child of .preview-section, so they
       need their own gap to match the spacing between the sections above. */
    #briefSections {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .preview-heading {
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: var(--ls-label);
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }

    .snapshot-card,
    .opener-card,
    .followup-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 12px;
      overflow-wrap: anywhere;
    }

    .snapshot-text {
      font-size: var(--fs-sm);
      line-height: 1.6;
      color: var(--text-soft);
      margin: 0;
    }

    .opener-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opener-quote {
      font-size: var(--fs-sm);
      line-height: 1.6;
      color: var(--text);
      font-style: italic;
      margin: 0;
      padding-left: 11px;
      border-left: 2px solid;
      border-image: var(--grad) 1;
    }

    .opener-copy-btn {
      align-self: flex-start;
    }

    .followups-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .followup-card {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .followup-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .followup-title {
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .followup-due {
      font-family: var(--font-mono);
      font-size: var(--fs-chip);
      font-weight: 500;
      color: #b4a3ff;
      background: var(--accent-soft);
      border: 1px solid var(--accent-line);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .followup-description {
      font-size: var(--fs-sm);
      line-height: 1.6;
      color: var(--text-soft);
      margin: 0;
    }

    .followup-rationale {
      font-size: var(--fs-chip);
      color: var(--muted);
      margin: 0;
    }

    .preview-footer {
      font-size: var(--fs-chip);
      color: var(--muted);
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    /* ---------- status ---------- */
    .status-message {
      padding: 11px 13px;
      border-radius: var(--r-md);
      font-size: var(--fs-sm);
      line-height: 1.5;
      display: none;
      overflow-wrap: anywhere;
    }

    .status-message.active {
      display: block;
    }

    .status-message.loading {
      background: var(--accent-soft);
      color: #b4a3ff;
      border: 1px solid var(--accent-line);
    }

    .status-message.success {
      background: var(--green-soft);
      color: #6ee7b7;
      border: 1px solid var(--green-line);
    }

    .status-message.error {
      background: var(--red-soft);
      color: #fca5a5;
      border: 1px solid var(--red-line);
    }

    .status-message.session-error {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .session-error-action {
      background: transparent;
      color: #fca5a5;
      border: none;
      cursor: pointer;
      font-size: var(--fs-chip);
      text-decoration: underline;
      padding: 0;
    }

    /* ---------- footer ---------- */
    .panel-footer {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: rgba(10, 14, 24, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* The close control lives in the FOOTER, deliberately.
       Chrome renders its own close X in the side-panel header, so an X in our
       own top-right would put two dismiss affordances in the same corner.
       A labelled action down here reads as a distinct, intentional control. */
    .close-row {
      display: flex;
      justify-content: center;
    }

    #closePanelBtn {
      font-size: var(--fs-chip);
      color: var(--muted);
    }

    #closePanelBtn:hover {
      color: var(--text);
    }

    @media (max-width: 360px) {
      .footer-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="panel-container">
    <div class="fieldbg"></div>

    <div class="panel-header">
      <div class="header-top">
        <span class="bd-logo">
          <span class="bd-mark" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 128 128" fill="none">
              <path d="M78 16 L34 74 H57 L50 112 L94 54 H71 Z" fill="#fff"
                    stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
            </svg>
          </span>
          <h1 class="header-title">BD Lead AI</h1>
        </span>
        <div class="header-actions">
          <span class="api-status" id="apiStatus" title="Backend connectivity"></span>
          <div class="auth-area" id="authArea">
            <button class="auth-button" id="authAction">Sign in</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel-content scrollable">
      <div class="form-section">
        <button class="btn btn-ghost btn-sm grab-button" id="grabButton" type="button">
          Grab from this page
        </button>

        <form id="leadForm">
          <div class="field">
            <label for="company_name">Company *</label>
            <input type="text" id="company_name" name="company_name" placeholder="Acme Inc">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="contact_name">Contact *</label>
              <input type="text" id="contact_name" name="contact_name" placeholder="Jane Smith">
            </div>
            <div class="field">
              <label for="contact_role">Role *</label>
              <input type="text" id="contact_role" name="contact_role" placeholder="VP Sales">
            </div>
          </div>

          <div class="field">
            <label for="signal">Signal / Trigger</label>
            <input type="text" id="signal" name="signal" placeholder="Series B, new leadership...">
          </div>

          <div class="field">
            <label for="pain_point">Pain point / Why now</label>
            <input type="text" id="pain_point" name="pain_point">
          </div>

          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" placeholder="Add context (bullets ok)"></textarea>
          </div>

          <div class="field">
            <label for="provider">CRM Provider</label>
            <select id="provider" name="provider">
              <option value="bitrix24">Bitrix24</option>
              <option value="hubspot">HubSpot</option>
            </select>
          </div>
        </form>

        <div class="status-message" id="statusMessage"></div>
      </div>

      <div class="preview-section" id="previewSection" style="display: none;">
        <h3 class="preview-heading">AI Preview</h3>

        <div id="snapshotContainer"></div>
        <div id="openerContainer"></div>
        <div id="followupsContainer"></div>
        <div id="previewFooter"></div>

        <!-- Buying signal / contact confidence / outreach email / CRM entry.
             Filled by renderBriefSections() in sidepanel.js, which decides per
             section: populated when the server sent valid data, otherwise the
             inert block. Empty here rather than static inert markup, because
             the branch is now a runtime decision. Every node is built with
             createElement/textContent — no API content is ever interpolated. -->
        <div id="briefSections"></div>
      </div>
    </div>

    <div class="panel-footer">
      <div class="footer-actions">
        <button class="btn btn-primary" id="generateBtn" type="button">Generate with AI</button>
        <button class="btn btn-ghost" id="pushBtn" type="button" disabled>Push to CRM</button>
      </div>
      <div class="close-row">
        <button class="btn btn-quiet btn-sm" id="closePanelBtn" type="button">Close panel</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="lead-api.js"></script>
  <script src="capture.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
