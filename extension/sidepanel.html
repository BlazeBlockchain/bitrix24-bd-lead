<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Lead AI - Side Panel</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      font-size: 15px;
    }

    .panel-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .panel-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .api-status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      background: var(--muted);
    }

    .api-status.online {
      background: var(--accent-3);
    }

    .auth-area {
      font-size: 13px;
      color: var(--muted);
    }

    .auth-area.valid {
      color: var(--accent-3);
    }

    .auth-button {
      background: transparent;
      color: var(--accent);
      border: none;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: underline;
    }

    .auth-button:hover {
      text-decoration: none;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field-row .field {
      gap: 6px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      display: block;
    }

    input, select, textarea {
      font: inherit;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: var(--radius);
      width: 100%;
      font-size: 14px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .grab-button {
      align-self: flex-start;
      padding: 8px 14px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s;
    }

    .grab-button:hover {
      background: var(--surface);
      border-color: var(--accent);
    }

    .grab-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .preview-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .preview-heading {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .snapshot-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }

    .snapshot-text {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      margin: 0;
    }

    .opener-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opener-quote {
      font-size: 14px;
      line-height: 1.6;
      color: var(--accent-2);
      font-style: italic;
      margin: 0;
      padding-left: 12px;
      border-left: 3px solid var(--accent-2);
    }

    .opener-copy-btn {
      align-self: flex-start;
      padding: 6px 12px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .opener-copy-btn:hover {
      background: var(--surface);
    }

    .followups-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .followup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .followup-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .followup-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .followup-due {
      display: inline-block;
      background: var(--surface-2);
      color: var(--accent-3);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .followup-description {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      margin: 0;
    }

    .followup-rationale {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    .preview-footer {
      font-size: 12px;
      color: var(--muted);
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .status-message {
      padding: 12px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .status-message.active {
      display: block;
    }

    .status-message.loading {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-2);
      border: 1px solid var(--accent-2);
    }

    .status-message.success {
      background: rgba(74, 222, 128, 0.1);
      color: var(--accent-3);
      border: 1px solid var(--accent-3);
    }

    .status-message.error {
      background: rgba(248, 113, 113, 0.1);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .status-message.session-error {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .session-error-action {
      background: transparent;
      color: var(--danger);
      border: none;
      cursor: pointer;
      font-size: 13px;
      text-decoration: underline;
      padding: 0;
    }

    .session-error-action:hover {
      text-decoration: none;
    }

    .panel-footer {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      position: sticky;
      bottom: 0;
    }

    .footer-button {
      font: inherit;
      padding: 8px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s;
    }

    .footer-button.primary {
      background: var(--accent);
      color: white;
      border: none;
    }

    .footer-button.primary:hover:not(:disabled) {
      filter: brightness(0.9);
    }

    .footer-button.primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer-button.secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .footer-button.secondary:hover:not(:disabled) {
      background: var(--surface);
      border-color: var(--accent);
    }

    .footer-button.secondary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Responsive: collapse field-row below ~360px */
    @media (max-width: 360px) {
      .field-row {
        grid-template-columns: 1fr;
      }

      .panel-footer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="panel-container">
    <div class="panel-header">
      <div class="header-top">
        <h1 class="header-title">BD Lead AI</h1>
        <div class="header-actions">
          <span class="api-status" id="apiStatus" title="Backend connectivity"></span>
          <div class="auth-area" id="authArea">
            <button class="auth-button" id="authAction">Sign in</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel-content">
      <div class="form-section">
        <button class="grab-button" id="grabButton" type="button">Grab from this page</button>

        <form id="leadForm">
          <div class="field">
            <label for="company_name">Company *</label>
            <input type="text" id="company_name" name="company_name" placeholder="Acme Inc">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="contact_name">Contact *</label>
              <input type="text" id="contact_name" name="contact_name" placeholder="Jane Smith">
            </div>
            <div class="field">
              <label for="contact_role">Role *</label>
              <input type="text" id="contact_role" name="contact_role" placeholder="VP Sales">
            </div>
          </div>

          <div class="field">
            <label for="signal">Signal / Trigger</label>
            <input type="text" id="signal" name="signal" placeholder="Series B, new leadership...">
          </div>

          <div class="field">
            <label for="pain_point">Pain point / Why now</label>
            <input type="text" id="pain_point" name="pain_point">
          </div>

          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" placeholder="Add context (bullets ok)"></textarea>
          </div>

          <div class="field">
            <label for="provider">CRM Provider</label>
            <select id="provider" name="provider">
              <option value="bitrix24">Bitrix24</option>
              <option value="hubspot">HubSpot</option>
            </select>
          </div>
        </form>

        <div class="status-message" id="statusMessage"></div>
      </div>

      <div class="preview-section" id="previewSection" style="display: none;">
        <h3 class="preview-heading">AI Preview</h3>

        <div id="snapshotContainer"></div>
        <div id="openerContainer"></div>
        <div id="followupsContainer"></div>
        <div id="previewFooter"></div>
      </div>
    </div>

    <div class="panel-footer">
      <button class="footer-button primary" id="generateBtn" type="button">Generate with AI</button>
      <button class="footer-button secondary" id="pushBtn" type="button" disabled>Push to CRM</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="lead-api.js"></script>
  <script src="capture.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
