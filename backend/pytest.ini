[pytest]
# T026: Full test coverage for adapters and orchestration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Markers for categorizing tests
markers =
    unit: unit tests (fast, mocked, hermetic)
    adapter: CRM adapter tests (Bitrix24, HubSpot)
    factory: CRM factory/provider selection tests
    service: service layer tests (lead_service, etc.)
    integration: integration tests (multiple components)
